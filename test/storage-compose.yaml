name: proxy-storage-smoke
services:
  storage-init:
    image: proxy-storage-init:latest
    environment:
      PROXY_DATA_PATH: /srv/proxy/data
      PROXY_SITES_PATH: /srv/proxy/sites
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes: [data:/data]
  check:
    image: proxy-storage-init:latest
    depends_on:
      storage-init: { condition: service_completed_successfully }
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [data:/data:ro]
    command:
      [
        node,
        --input-type=module,
        -e,
        "import {statSync} from 'node:fs'; import assert from 'node:assert/strict'; for(const [path,uid] of [['control',10001],['edge',10002],['certificates',10003]])assert.equal(statSync('/data/'+path).uid,uid); console.log('PASS: Compose waits for successful storage initialization.');",
      ]
volumes:
  data:
