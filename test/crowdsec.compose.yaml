name: proxy-crowdsec-test
services:
  crowdsec:
    image: proxy-crowdsec:latest
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - config:/etc/crowdsec
      - data:/var/lib/crowdsec/data
      - ipc:/security-ipc
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cscli lapi status >/dev/null &&
          test -s /security-ipc/bouncer.conf &&
          test -S /security-ipc/crowdsec.sock &&
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1', 7422), timeout=1); s.close()"
      interval: 5s
      retries: 30
  tests:
    image: proxy-edge:latest
    network_mode: service:crowdsec
    entrypoint: [proxy-as-edge, node, --test, /app/test/crowdsec.test.js]
    environment:
      PROXY_CROWDSEC_TEST: 'true'
    volumes:
      - ipc:/security-ipc:ro
      - ${PROXY_TEST_SOURCE:-..}/test/crowdsec.test.js:/app/test/crowdsec.test.js:ro
      - ${PROXY_TEST_SOURCE:-..}/server:/app/server:ro
volumes:
  config:
  data:
  ipc:
