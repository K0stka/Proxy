# Optional host storage: use after compose.yaml in Komodo Compose files.
services:
  control:
    environment:
      PROXY_HANDOFF_AGENT: ${PROXY_HANDOFF_ENABLED:-false}
      PROXY_DATA_PATH: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}
      PROXY_SITES_PATH: ${PROXY_SITES_PATH:?Set PROXY_SITES_PATH}
    volumes:
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/control
        target: /state
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/certificate-policy
        target: /cert-policy
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/cert-status
        target: /cert-status
        read_only: true
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/cert-requests
        target: /cert-requests
        bind: { create_host_path: true }
  edge:
    environment:
      PROXY_HANDOFF_AGENT: ${PROXY_HANDOFF_ENABLED:-false}
    volumes:
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/edge
        target: /runtime
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/tls
        target: /tls
        read_only: true
        bind: { create_host_path: true }
  certificates:
    volumes:
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/certificate-policy
        target: /cert-policy
        read_only: true
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/certificates
        target: /certbot
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/tls
        target: /tls
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/cert-status
        target: /cert-status
        bind: { create_host_path: true }
      - type: bind
        source: ${PROXY_DATA_PATH:?Set PROXY_DATA_PATH}/cert-requests
        target: /cert-requests
        bind: { create_host_path: true }
