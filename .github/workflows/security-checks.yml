name: Security checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build validation runner and run application checks
        run: docker build --pull -f containers/check.Dockerfile -t proxy-security-check .
      - name: Run isolated container checks
        run: |
          docker run --rm \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --env PROXY_TEST_SOURCE="$GITHUB_WORKSPACE" proxy-security-check
